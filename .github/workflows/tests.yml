name: checks

on:
  push:
  pull_request:

jobs:
  rack-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: clone pater
        run: git clone --depth 1 https://github.com/paternosterrack/pater.git ../pater
      - name: run rack release prep checks (no signing)
        run: |
          cd ../pater
          cargo run -- rack sync --rack-dir ../rack
          cargo run -- rack mark-unknown-external --rack-dir ../rack
          cargo run -- rack license-audit --rack-dir ../rack || true
      - name: validate marketplace json exists
        run: test -f .pater/marketplace.json
