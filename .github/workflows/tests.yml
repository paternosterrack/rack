name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: script unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: license audit snapshot (informational)
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/license_audit.py || true
