name: rack-guardrails

on:
  push:
  pull_request:

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: required files exist
        run: |
          test -f .pater/marketplace.json
          test -f .pater/marketplace.sig
          test -f .pater/trusted-pubkey.hex

      - name: validate marketplace JSON + duplicate plugin names
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          p = root / '.pater/marketplace.json'
          data = json.loads(p.read_text(encoding='utf-8'))
          plugins = data.get('plugins', [])
          assert isinstance(plugins, list), 'plugins must be an array'

          names = [x.get('name') for x in plugins]
          assert all(isinstance(n, str) and n.strip() for n in names), 'every plugin must have non-empty string name'

          seen = set()
          dupes = set()
          for n in names:
            if n in seen:
              dupes.add(n)
            seen.add(n)

          if dupes:
            raise SystemExit(f'duplicate plugin names found: {sorted(dupes)}')

          missing_local = []
          for x in plugins:
            src = x.get('source', '')
            if isinstance(src, str) and src.startswith('./'):
              target = root / src[2:]
              if not target.exists():
                missing_local.append((x.get('name'), src))

          if missing_local:
            raise SystemExit(f'missing local plugin sources: {missing_local[:10]}')

          print(f'OK: {len(plugins)} plugins, no duplicates, local sources valid')
          PY

      - name: validate signature/public key format
        run: |
          python3 - <<'PY'
          import string
          from pathlib import Path

          hexchars = set(string.hexdigits)

          # .pater/marketplace.sig: one or more 64-byte signatures (128 hex chars) allowed, one per line
          sig_lines = [l.strip() for l in Path('.pater/marketplace.sig').read_text().splitlines() if l.strip() and not l.strip().startswith('#')]
          if not sig_lines:
            raise SystemExit('marketplace.sig has no signatures')
          for i, line in enumerate(sig_lines, 1):
            if len(line) != 128 or any(c not in hexchars for c in line):
              raise SystemExit(f'invalid signature format on line {i}')

          # trusted pubkey must be 32-byte hex (64 chars)
          key = Path('.pater/trusted-pubkey.hex').read_text().strip()
          if len(key) != 64 or any(c not in hexchars for c in key):
            raise SystemExit('trusted-pubkey.hex must be 64 hex chars')

          print('OK: signature and pubkey format valid')
          PY

      - name: verify signature against marketplace.json
        run: |
          python3 - <<'PY'
          import binascii
          import subprocess
          import tempfile
          from pathlib import Path

          root = Path('.')
          msg = root / '.pater/marketplace.json'
          sig_lines = [l.strip() for l in (root / '.pater/marketplace.sig').read_text().splitlines() if l.strip() and not l.strip().startswith('#')]
          key_hex = (root / '.pater/trusted-pubkey.hex').read_text().strip()

          # Ed25519 SPKI DER prefix + raw 32-byte key
          spki_der = bytes.fromhex('302a300506032b6570032100') + bytes.fromhex(key_hex)

          with tempfile.TemporaryDirectory() as td:
            td = Path(td)
            pub_der = td / 'pub.der'
            pub_pem = td / 'pub.pem'
            pub_der.write_bytes(spki_der)
            subprocess.check_call(['openssl', 'pkey', '-pubin', '-inform', 'DER', '-in', str(pub_der), '-out', str(pub_pem)])

            verified = False
            for line in sig_lines:
              sig_bin = td / 'sig.bin'
              sig_bin.write_bytes(binascii.unhexlify(line))
              p = subprocess.run([
                'openssl', 'pkeyutl', '-verify', '-pubin', '-inkey', str(pub_pem),
                '-rawin', '-in', str(msg), '-sigfile', str(sig_bin)
              ], capture_output=True)
              if p.returncode == 0:
                verified = True
                break

            if not verified:
              raise SystemExit('signature verification failed: no signature matched trusted pubkey')

          print('OK: cryptographic signature verifies marketplace.json')
          PY
